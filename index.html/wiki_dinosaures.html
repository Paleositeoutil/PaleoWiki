<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaleoWiki - Encyclopédie Paléontologique</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Scientific Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cinzel & Playfair Display for academic headers & Inter for clean text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        earth: {
                            50: '#fcfbfa',
                            100: '#f4f1ea',
                            200: '#e5decb',
                            300: '#d1c5a9',
                            600: '#8c7a5b',
                            800: '#4a402d',
                            900: '#2c2519',
                        },
                        forest: {
                            600: '#2e5a44',
                            700: '#234635',
                            800: '#1a3528',
                            900: '#11231a',
                        },
                        amber: {
                            600: '#c27803',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-earth-100 text-earth-900 font-sans h-full flex flex-col antialiased">

    <!-- Top Scientific Header -->
    <header class="bg-forest-900 text-white shadow-md border-b border-forest-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-forest-700 p-2.5 rounded-xl border border-forest-600 shadow-inner">
                    <i class="fa-solid fa-bone text-amber-500 text-xl"></i>
                </div>
                <div>
                    <h1 class="font-serif text-2xl font-bold tracking-wide">PaleoWiki</h1>
                    <p class="text-xs text-earth-300 font-sans tracking-wider uppercase">Encyclopédie Paléontologique & Ostéologique</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <button onclick="app.openModal()" class="bg-forest-700 hover:bg-forest-600 text-white px-4 py-2 rounded-xl font-medium text-xs shadow transition flex items-center space-x-2 border border-forest-600">
                    <i class="fa-solid fa-plus-circle text-amber-400"></i>
                    <span>Ajouter une espèce</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout Container -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 flex flex-col lg:flex-row gap-6 overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-full lg:w-80 bg-white rounded-2xl shadow-sm border border-earth-200 flex flex-col overflow-hidden flex-shrink-0">
            <!-- Search & Filters -->
            <div class="p-4 border-b border-earth-200 bg-earth-50/50">
                <div class="relative mb-3">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-earth-600">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="app.handleSearch(this.value)" placeholder="Rechercher par nom, clade, époque..." class="w-full pl-9 pr-4 py-2 bg-white border border-earth-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-forest-600 focus:border-transparent transition">
                </div>
                
                <!-- Period filter badges -->
                <div class="flex gap-1.5 overflow-x-auto pb-1 text-[11px]">
                    <button onclick="app.setPeriodFilter('all')" class="period-btn active px-2.5 py-1 rounded-lg font-medium bg-forest-900 text-white transition whitespace-nowrap">Tous</button>
                    <button onclick="app.setPeriodFilter('Trias')" class="period-btn px-2.5 py-1 rounded-lg font-medium bg-earth-200 text-earth-800 hover:bg-earth-300 transition whitespace-nowrap">Trias</button>
                    <button onclick="app.setPeriodFilter('Jurassique')" class="period-btn px-2.5 py-1 rounded-lg font-medium bg-earth-200 text-earth-800 hover:bg-earth-300 transition whitespace-nowrap">Jurassique</button>
                    <button onclick="app.setPeriodFilter('Crétacé')" class="period-btn px-2.5 py-1 rounded-lg font-medium bg-earth-200 text-earth-800 hover:bg-earth-300 transition whitespace-nowrap">Crétacé</button>
                </div>
            </div>

            <!-- Species List -->
            <div id="speciesList" class="flex-1 overflow-y-auto divide-y divide-earth-100 p-2 space-y-1">
                <!-- Populated dynamically -->
            </div>
        </aside>

        <!-- Main Article Content View -->
        <main id="articleContainer" class="flex-1 bg-white rounded-2xl shadow-sm border border-earth-200 overflow-y-auto p-6 lg:p-8 flex flex-col">
            <!-- Populated dynamically -->
        </main>
    </div>

    <!-- Modal for Create / Edit Species -->
    <div id="speciesModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-earth-200 flex flex-col">
            <div class="p-5 border-b border-earth-200 flex justify-between items-center bg-earth-50">
                <h3 id="modalTitle" class="font-serif font-bold text-lg text-forest-900">Nouvelle Notice Paléontologique</h3>
                <button onclick="app.closeModal()" class="text-earth-600 hover:text-earth-900 text-lg p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="speciesForm" onsubmit="app.saveSpecies(event)" class="p-6 space-y-4 text-xs">
                <input type="hidden" id="editId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Nom scientifique de l'espèce *</label>
                        <input type="text" id="formName" required class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Signification du nom *</label>
                        <input type="text" id="formMeaning" required class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Régime alimentaire *</label>
                        <select id="formDiet" class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none bg-white">
                            <option value="Carnivore">Carnivore</option>
                            <option value="Herbivore">Herbivore</option>
                            <option value="Piscivore">Piscivore</option>
                            <option value="Omnivore">Omnivore</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Période géologique *</label>
                        <select id="formPeriod" class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none bg-white">
                            <option value="Trias">Trias</option>
                            <option value="Jurassique">Jurassique</option>
                            <option value="Crétacé">Crétacé</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Clade / Groupe *</label>
                        <input type="text" id="formClade" required placeholder="Théropode, Sauropode..." class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Époque précise & âges (M.A.) *</label>
                        <input type="text" id="formEra" required placeholder="Ex: Crétacé supérieur (68 - 66 M.A.)" class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Localisation géographique *</label>
                        <input type="text" id="formLocation" required placeholder="Amérique du Nord, Mongolie..." class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Taille / Envergure *</label>
                        <input type="text" id="formSize" required placeholder="Ex: 12 mètres" class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-earth-800 mb-1">Masse estimée *</label>
                        <input type="text" id="formWeight" required placeholder="Ex: 8 tonnes" class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-earth-800 mb-1">URL de l'illustration (Fossile / Squelette) *</label>
                    <input type="url" id="formImage" required placeholder="https://..." class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none">
                </div>

                <div class="border-t border-earth-200 pt-3 space-y-3">
                    <h4 class="font-bold text-forest-900">Onglets scientifiques</h4>
                    <div>
                        <label class="block text-earth-700 mb-1 font-medium">Vue d'ensemble</label>
                        <textarea id="formOverview" rows="2" required class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-earth-700 mb-1 font-medium">Anatomie & Biomécanique</label>
                        <textarea id="formAnatomy" rows="2" required class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-earth-700 mb-1 font-medium">Paléoenvironnement</label>
                        <textarea id="formPaleo" rows="2" required class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-earth-700 mb-1 font-medium">Découverte & Histoire</label>
                        <textarea id="formHistory" rows="2" required class="w-full p-2.5 border border-earth-200 rounded-xl focus:ring-2 focus:ring-forest-600 focus:outline-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-earth-200">
                    <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-earth-200 text-earth-800 rounded-xl font-medium hover:bg-earth-300 transition">Annuler</button>
                    <button type="submit" class="px-5 py-2 bg-forest-900 text-white rounded-xl font-medium hover:bg-forest-800 transition shadow">Enregistrer la notice</button>
                </div>
            </form>
        </div>
    </div>

        class PaleoWiki {
            constructor() {
                this.dinosaurs = JSON.parse(localStorage.getItem('paleo_dinosaurs')) || defaultDinosaurs;

                this.activeTab = 'overview';

                        btn.className = 'period-btn px-2.5 py-1 rounded-lg font-medium bg-forest-900 text-white transition whitespace-nowrap';
                    } else {
                        btn.className = 'period-btn px-2.5 py-1 rounded-lg font-medium bg-earth-200 text-earth-800 hover:bg-earth-300 transition whitespace-nowrap';
                    }
                });
                this.renderList();
            }

                this.currentId = id;
                this.activeTab = 'overview';
                this.renderList();
                this.renderArticle();
            }

            setTab(tab) {
                this.activeTab = tab;
                this.renderArticle();
            }

                switch(diet.toLowerCase()) {
                    case 'carnivore': return '<span class="w-6 h-6 rounded-full bg-red-100 border border-red-200 flex items-center justify-center text-[11px]" title="Carnivore"><i class="fa-solid fa-skull text-red-700"></i></span>';

                    default: return '<span class="w-6 h-6 rounded-full bg-earth-100 border border-earth-200 flex items-center justify-center text-[11px]"><i class="fa-solid fa-paw text-earth-700"></i></span>';
                }
            }

            getFilteredDinosaurs() {
                return this.dinosaurs.filter(d => {
                    const matchesSearch = d.name.toLowerCase().includes(this.searchQuery) ||
                                          d.clade.toLowerCase().includes(this.searchQuery) ||
                                          d.location.toLowerCase().includes(this.searchQuery) ||
                                          (d.commonName && d.commonName.toLowerCase().includes(this.searchQuery));
                    const matchesPeriod = this.periodFilter === 'all' || d.period === this.periodFilter;
                    return matchesSearch && matchesPeriod;
                });
            }

                const listEl = document.getElementById('speciesList');
                const filtered = this.getFilteredDinosaurs();

                if (filtered.length === 0) {
                    listEl.innerHTML = `<div class="p-6 text-center text-earth-600 text-xs">Aucune espèce trouvée.</div>`;
                    return;

                    document.getElementById('formLocation').value = d.location;
                    document.getElementById('formSize').value = d.size;
                    document.getElementById('formWeight').value = d.weight;
                    document.getElementById('formImage').value = d.image;
                    document.getElementById('formOverview').value = d.tabs.overview || '';
                    document.getElementById('formAnatomy').value = d.tabs.anatomy || '';
                    document.getElementById('formPaleo').value = d.tabs.paleo || '';
                    document.getElementById('formHistory').value = d.tabs.history || '';
                } else {
                    title.textContent = "Nouvelle Notice Paléontologique";
                    document.getElementById('speciesForm').reset();
                    document.getElementById('editId').value = '';
                }
            }

            closeModal() {
                document.getElementById('speciesModal').classList.add('hidden');
            }

            saveSpecies(e) {
                e.preventDefault();
                const editId = document.getElementById('editId').value;
                const name = document.getElementById('formName').value;
                const newObj = {
                    id: editId || name.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                    commonName: name.split(' ')[0],
                    name: name,
                    meaning: document.getElementById('formMeaning').value,
                    diet: document.getElementById('formDiet').value,
                    period: document.getElementById('formPeriod').value,
                    clade: document.getElementById('formClade').value,
                    era: document.getElementById('formEra').value,
                    location: document.getElementById('formLocation').value,
                    size: document.getElementById('formSize').value,
                    weight: document.getElementById('formWeight').value,
                    image: document.getElementById('formImage').value,
                    tabs: {
                        overview: document.getElementById('formOverview').value,
                        anatomy: document.getElementById('formAnatomy').value,
                        paleo: document.getElementById('formPaleo').value,
                        history: document.getElementById('formHistory').value,
                        sitesList: [
                            { location: document.getElementById('formLocation').value, date: "Découverte de référence", details: "Spécimen répertorié dans les archives du wiki." }
                        ]
                    }
                };

                if (editId) {
                    const idx = this.dinosaurs.findIndex(i => i.id === editId);
                    if (idx !== -1) {
                        newObj.tabs.sitesList = this.dinosaurs[idx].tabs.sitesList || newObj.tabs.sitesList;
                        this.dinosaurs[idx] = newObj;
                    }
                } else {
                    this.dinosaurs.push(newObj);
                }

                this.saveToStorage();
                this.closeModal();
                this.selectDino(newObj.id);
            }

            deleteSpecies(id) {
                if (confirm("Voulez-vous vraiment supprimer cette notice de l'encyclopédie ?")) {
                    this.dinosaurs = this.dinosaurs.filter(i => i.id !== id);
                    this.saveToStorage();
                    this.currentId = this.dinosaurs[0]?.id || null;
                    this.init();
                }
            }
        }

        const app = new PaleoWiki();
    </script>
</body>
</html>
